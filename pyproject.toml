[project]
name = "ci-triage"
version = "0.1.0"
description = "Classify GitHub Actions failures from truncated logs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
]
[dependency-groups]
dev = ["pytest>=8.3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]
[tool.pytest.ini_options]
testpaths = ["tests"]
